name: brainnest
description: "BrainNest: StudyFlow AI Flutter Android App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.1
  flutter_secure_storage: ^9.2.2
  file_picker: ^8.0.0
  image_picker: ^1.1.2
  speech_to_text: ^7.0.0
  flutter_markdown: ^0.7.3
  syncfusion_flutter_pdf: ^26.2.1
  intl: ^0.19.0
  flutter_math_fork: ^0.7.4
  markdown: ^7.3.0
  device_info_plus: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png

dependency_overrides:
  flutter_math_fork:
    git:
      url: https://github.com/Telosnex/flutter_math_fork_fork.git
